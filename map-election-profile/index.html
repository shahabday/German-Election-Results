<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Voting Profile — All Elections Blended</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #2a2e38;
    --text: #e8eaed;
    --text-dim: #9aa0ab;
    --accent: #4a90e2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { position: relative; height: 100vh; width: 100vw; }
  #map { position: absolute; inset: 0; background: #0b0d11; }

  #panel {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 14px 16px; width: 330px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #panel h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  #panel .subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }

  .row { margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .row-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 6px; }

  .toggle-group { display: flex; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
  .toggle-group button {
    flex: 1 1 auto; background: transparent; color: var(--text-dim); border: none; padding: 7px 4px;
    font-size: 12px; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .toggle-group button.active { background: var(--accent); color: #fff; }
  .toggle-group button:not(.active):hover { background: #20242e; color: var(--text); }

  #rangeLabel { font-size: 17px; font-weight: 700; text-align: center; margin: 2px 0 8px; }
  #rangeLabel .arrow { color: var(--text-dim); font-weight: 400; margin: 0 4px; }
  .range-slider { width: 100%; accent-color: var(--accent); display: block; margin-bottom: 4px; }
  .range-slider-label { font-size: 10px; color: var(--text-dim); display: flex; justify-content: space-between; }
  .presets { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .presets button {
    flex: 1 1 auto; background: #1e222b; color: var(--text-dim); border: 1px solid var(--panel-border);
    border-radius: 5px; padding: 5px 4px; font-size: 10.5px; cursor: pointer;
  }
  .presets button:hover { background: #262b36; color: var(--text); }

  #statsBar { display: flex; gap: 6px; margin-top: 4px; }
  .stat { flex: 1; background: #1e222b; border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px 4px; text-align: center; }
  .stat .n { font-size: 14px; font-weight: 700; }
  .stat .l { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }

  #statusLine { font-size: 11px; color: var(--text-dim); margin-top: 10px; min-height: 14px; }
  #noteLine { font-size: 10.5px; color: var(--text-dim); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border); }

  #legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 10px 14px; font-size: 11px; max-width: 240px; max-height: 260px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #legend .legend-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 6px; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; cursor: help; }
  .legend-swatch { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
  .legend-pct { color: var(--text-dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  .legend-gradient { height: 10px; border-radius: 3px; margin-bottom: 4px; }
  .legend-scale-labels { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-dim); margin-bottom: 4px; }

  .leaflet-tooltip.profile-tooltip {
    background: rgba(15, 17, 21, 0.97); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); max-width: 260px;
  }
  .profile-tooltip .tt-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .profile-tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .profile-tooltip .tt-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .profile-tooltip .tt-party { flex: 1; }
  .profile-tooltip .tt-share { font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .profile-tooltip .tt-meta { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--panel-border); color: var(--text-dim); font-size: 10.5px; }

  #loading {
    position: absolute; top: 16px; right: 16px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 6px 12px; font-size: 11px; color: var(--text-dim); display: none;
  }
  #loading.active { display: block; }
  #credit {
    position: absolute; bottom: 8px; right: 8px; z-index: 999;
    font-size: 10px; color: var(--text-dim); background: rgba(15,17,21,0.7);
    padding: 3px 8px; border-radius: 6px;
  }

  #panelHeaderRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #panelHeaderRow h1 { margin: 0; }
  #panelToggle {
    display: none; flex: 0 0 auto; width: 26px; height: 26px; align-items: center; justify-content: center;
    background: #1e222b; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-dim);
    font-size: 12px; cursor: pointer; padding: 0;
  }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 32px); max-width: 360px; }
    #panelToggle { display: flex; }
    #panelBody { max-height: 0; overflow: hidden; }
    #panel.expanded #panelBody { max-height: calc(100vh - 160px); overflow-y: auto; }
    #legend { max-width: 190px; padding: 8px 10px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="panel">
    <h1>Voting Profile</h1>
    <div class="subtitle">All 4 election types blended, over a year window you pick</div>

    <div class="row">
      <div class="row-label">Time window</div>
      <div id="rangeLabel">—</div>
      <div class="range-slider-label"><span>From</span></div>
      <input type="range" id="fromSlider" class="range-slider" min="0" max="0" step="1" value="0">
      <div class="range-slider-label"><span>To</span></div>
      <input type="range" id="toSlider" class="range-slider" min="0" max="0" step="1" value="0">
      <div class="presets">
        <button data-preset="all">All time</button>
        <button data-preset="10">Last 10y</button>
        <button data-preset="5">Last 5y</button>
        <button data-preset="latest">Latest only</button>
      </div>
    </div>

    <div class="row">
      <div class="row-label">View</div>
      <div class="toggle-group" id="modeToggle">
        <button data-mode="dominant" class="active">Dominant party</button>
        <button data-mode="consistency">Consistency</button>
      </div>
    </div>

    <div class="row" id="statsBar">
      <div class="stat"><div class="n" id="statAreas">—</div><div class="l">Areas</div></div>
      <div class="stat"><div class="n" id="statConsistent">—</div><div class="l">Fully agree</div></div>
    </div>

    <div id="statusLine"></div>
    <div id="noteLine"></div>
  </div>

  <script>
  (function () {
    var panel = document.getElementById("panel");
    if (!panel) return;
    var h1 = panel.querySelector("h1");
    if (!h1) return;
    var subtitle = panel.querySelector(".subtitle");
    var headerRow = document.createElement("div");
    headerRow.id = "panelHeaderRow";
    var toggle = document.createElement("button");
    toggle.id = "panelToggle";
    toggle.type = "button";
    toggle.setAttribute("aria-label", "Toggle controls");
    toggle.textContent = "▾";
    panel.insertBefore(headerRow, h1);
    headerRow.appendChild(h1);
    headerRow.appendChild(toggle);
    var body = document.createElement("div");
    body.id = "panelBody";
    Array.prototype.slice.call(panel.children).forEach(function (el) {
      if (el === headerRow || el === subtitle) return;
      body.appendChild(el);
    });
    panel.appendChild(body);
    toggle.addEventListener("click", function () {
      var expanded = panel.classList.toggle("expanded");
      toggle.textContent = expanded ? "▴" : "▾";
    });
  })();
  </script>

  <div id="legend">
    <div class="legend-title" id="legendTitle">Legend</div>
    <div id="legendItems"></div>
  </div>

  <div id="loading">Loading…</div>
  <div id="credit">Data: GERDA · Boundaries: BKG VG250 via gjrichter</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  const DATA_DIR = "data/prepared";
  const TYPES = ["federal", "european", "landtag", "kommunal"];
  const TYPE_LABELS = { federal: "Bundestag", european: "Europawahl", landtag: "Landtag", kommunal: "Kommunalwahl" };

  const STATE_SLUG_TO_CODE = {
    schleswig_holstein: "01", hamburg: "02", niedersachsen: "03", bremen: "04",
    north_rhine_westphalia: "05", hesse: "06", rhineland_palatinate: "07",
    baden_wuerttemberg: "08", bavaria: "09", saarland: "10", berlin: "11",
    brandenburg: "12", mecklenburg_vorpommern: "13", saxony: "14",
    saxony_anhalt: "15", thuringia: "16",
  };
  const CODE_TO_STATE_SLUG = Object.fromEntries(Object.entries(STATE_SLUG_TO_CODE).map(([s, c]) => [c, s]));

  const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([51.15, 10.45], 6);
  L.control.zoom({ position: "topright" }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nomatter/{z}/{x}/{y}{r}.png", { maxZoom: 19, subdomains: "abcd" }).addTo(map);

  const state = {
    manifest: null,
    muniBoundary: null,
    geoLayer: null,
    yearMin: null, yearMax: null,
    rangeFrom: null, rangeTo: null,
    mode: "dominant",
    dataCache: {},     // cacheKey -> {ags: {w,s,b,t}}
    profileCache: {},  // ags -> profile | null
    renderToken: 0,
  };

  function fetchJson(url) {
    return fetch(url, { cache: "no-cache" }).then((r) => {
      if (!r.ok) throw new Error(`${url}: ${r.status}`);
      return r.json();
    });
  }
  function setLoading(on) { document.getElementById("loading").classList.toggle("active", on); }
  function partyInfo(key) { return state.manifest.party_info[key] || { label: key, color: "#999999" }; }

  // ---------- color ----------
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgbToHex([r, g, b]) {
    return "#" + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  }
  function blend(hexA, hexB, t) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return rgbToHex(a.map((v, i) => v + (b[i] - v) * t));
  }
  const CONSISTENCY_LOW = "#1b2838";
  const CONSISTENCY_HIGH = "#2dd4bf";

  // ---------- file enumeration + loading ----------
  function allFileUrls() {
    const urls = [];
    for (const y of state.manifest.federal.years) urls.push({ key: `federal||${y}`, url: `${DATA_DIR}/federal/${y}.json` });
    for (const y of state.manifest.european.years) urls.push({ key: `european||${y}`, url: `${DATA_DIR}/european/${y}.json` });
    for (const type of ["landtag", "kommunal"]) {
      const states = state.manifest[type].states;
      for (const slug in states) {
        for (const y of states[slug].years) {
          urls.push({ key: `${type}|${slug}|${y}`, url: `${DATA_DIR}/${type}/${slug}/${y}.json` });
        }
      }
    }
    return urls;
  }

  function loadAll() {
    const entries = allFileUrls();
    let done = 0;
    document.getElementById("statusLine").textContent = `Loading ${entries.length} election-year files…`;
    return Promise.all(entries.map(({ key, url }) =>
      fetchJson(url).then((d) => {
        state.dataCache[key] = d;
        done++;
        if (done % 40 === 0) document.getElementById("statusLine").textContent = `Loading ${done}/${entries.length} election-year files…`;
      }).catch(() => { /* a missing file just means no data for that year - skip it */ })
    ));
  }

  // ---------- profile computation ----------
  function typeYearsForAgs(type, ags) {
    if (type === "federal" || type === "european") return state.manifest[type].years;
    const slug = CODE_TO_STATE_SLUG[ags.slice(0, 2)];
    const s = state.manifest[type].states[slug];
    return s ? s.years : [];
  }
  function cacheKeyFor(type, ags, year) {
    if (type === "federal" || type === "european") return `${type}||${year}`;
    const slug = CODE_TO_STATE_SLUG[ags.slice(0, 2)];
    return `${type}|${slug}|${year}`;
  }

  // Blends all 4 election types into one picture per area, over [fromY, toY]. Two-step
  // average (years within a type, then types with each other) so Bundestag's ~9
  // elections don't swamp Europawahl's ~4 just by having more data points. A party
  // absent from an area's top-5 in a given year counts as 0 for that year - the same
  // top-5-truncation tradeoff map-trends' swing calculation already makes, needed here
  // so a party that only occasionally surges doesn't get inflated by counting only its
  // good years.
  function computeProfile(ags, fromY, toY) {
    const typeAverages = {};
    const typeDominant = {};
    let contributingTypes = 0;
    for (const type of TYPES) {
      const years = typeYearsForAgs(type, ags).filter((y) => +y >= fromY && +y <= toY);
      if (!years.length) continue;
      const sums = {};
      let contribCount = 0;
      for (const y of years) {
        const rec = (state.dataCache[cacheKeyFor(type, ags, y)] || {})[ags];
        if (!rec) continue;
        contribCount++;
        for (const [p, v] of rec.b || []) sums[p] = (sums[p] || 0) + v;
      }
      if (!contribCount) continue;
      const avg = {};
      let bestP = null, bestV = -1;
      for (const p in sums) {
        avg[p] = sums[p] / contribCount;
        if (avg[p] > bestV) { bestV = avg[p]; bestP = p; }
      }
      typeAverages[type] = avg;
      typeDominant[type] = bestP;
      contributingTypes++;
    }
    if (!contributingTypes) return null;
    const overall = {};
    for (const type in typeAverages) {
      for (const p in typeAverages[type]) overall[p] = (overall[p] || 0) + typeAverages[type][p];
    }
    let dominant = null, dominantV = -1;
    for (const p in overall) {
      overall[p] /= contributingTypes;
      if (overall[p] > dominantV) { dominantV = overall[p]; dominant = p; }
    }
    let agree = 0;
    for (const type in typeDominant) if (typeDominant[type] === dominant) agree++;
    return { overall, dominant, dominantShare: dominantV, consistency: agree / contributingTypes, contributingTypes, typeDominant };
  }

  function recomputeAllProfiles() {
    const cache = {};
    for (const f of state.muniBoundary.features) {
      cache[f.properties.ags] = computeProfile(f.properties.ags, state.rangeFrom, state.rangeTo);
    }
    state.profileCache = cache;
  }

  // ---------- rendering ----------
  function styleForProfile(profile) {
    if (!profile) return { color: "#3a3f4b", weight: 0.3, fillColor: "#15171d", fillOpacity: 0.35 };
    if (state.mode === "dominant") {
      const info = partyInfo(profile.dominant);
      return { color: "#3a3f4b", weight: 0.3, fillColor: info.color, fillOpacity: Math.min(0.95, 0.35 + profile.dominantShare * 1.4) };
    }
    const color = blend(CONSISTENCY_LOW, CONSISTENCY_HIGH, profile.consistency);
    return { color: "#0b0d11", weight: 0.3, fillColor: color, fillOpacity: 0.85 };
  }

  function fmtPct(v) { return v == null ? "—" : `${(v * 100).toFixed(1)}%`; }

  function tooltipHtml(name, profile) {
    if (!profile) return `<div class="tt-title">${name}</div><div class="tt-meta">No election data in this window</div>`;
    let html = `<div class="tt-title">${name}</div>`;
    const ranked = Object.entries(profile.overall).sort((a, b) => b[1] - a[1]).slice(0, 5);
    for (const [party, share] of ranked) {
      const info = partyInfo(party);
      html += `<div class="tt-row"><span class="tt-swatch" style="background:${info.color}"></span><span class="tt-party">${info.label}</span><span class="tt-share">${fmtPct(share)}</span></div>`;
    }
    const perType = TYPES.filter((t) => profile.typeDominant[t]).map((t) => `${TYPE_LABELS[t]}: ${partyInfo(profile.typeDominant[t]).label}`).join(" · ");
    html += `<div class="tt-meta">${profile.contributingTypes}/4 election types in window · ${Math.round(profile.consistency * 100)}% agree on ${partyInfo(profile.dominant).label}<br>${perType}</div>`;
    return html;
  }

  function updateStats() {
    const profiles = Object.values(state.profileCache).filter(Boolean);
    const total = profiles.length;
    const fullAgree = profiles.filter((p) => p.consistency === 1 && p.contributingTypes >= 2).length;
    document.getElementById("statAreas").textContent = total.toLocaleString();
    document.getElementById("statConsistent").textContent = total ? `${Math.round((fullAgree / total) * 100)}%` : "—";
  }

  function updateLegend() {
    const title = document.getElementById("legendTitle");
    const items = document.getElementById("legendItems");
    items.innerHTML = "";
    const profiles = Object.values(state.profileCache).filter(Boolean);
    if (state.mode === "dominant") {
      title.textContent = "Dominant party (blended)";
      const counts = {};
      for (const p of profiles) counts[p.dominant] = (counts[p.dominant] || 0) + 1;
      const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);
      for (const [party, n] of ranked) {
        const info = partyInfo(party);
        const div = document.createElement("div");
        div.className = "legend-item";
        div.title = info.label;
        div.innerHTML = `<span class="legend-swatch" style="background:${info.color}"></span><span>${info.label}</span><span class="legend-pct">${n}</span>`;
        items.appendChild(div);
      }
    } else {
      title.textContent = "Do all 4 types agree?";
      const grad = document.createElement("div");
      grad.className = "legend-gradient";
      grad.style.background = `linear-gradient(to right, ${CONSISTENCY_LOW}, ${CONSISTENCY_HIGH})`;
      const labels = document.createElement("div");
      labels.className = "legend-scale-labels";
      labels.innerHTML = `<span>split-ticket</span><span>fully agree</span>`;
      items.appendChild(grad);
      items.appendChild(labels);
    }
  }

  function render() {
    recomputeAllProfiles();
    if (state.geoLayer) { map.removeLayer(state.geoLayer); state.geoLayer = null; }
    state.geoLayer = L.geoJSON(state.muniBoundary, {
      style: (f) => styleForProfile(state.profileCache[f.properties.ags]),
      onEachFeature: (f, layer) => {
        const profile = state.profileCache[f.properties.ags];
        layer.bindTooltip(tooltipHtml(f.properties.name, profile), { className: "profile-tooltip", sticky: true, direction: "top" });
        layer.on("mouseover", () => layer.setStyle({ weight: 1.4, color: "#ffffff" }));
        layer.on("mouseout", () => state.geoLayer.resetStyle(layer));
      },
    }).addTo(map);

    updateStats();
    updateLegend();
    document.getElementById("statusLine").textContent = `${state.rangeFrom}–${state.rangeTo} · all 4 election types blended`;
  }

  // ---------- range sliders ----------
  function updateRangeLabel() {
    document.getElementById("rangeLabel").innerHTML = `${state.rangeFrom}<span class="arrow">–</span>${state.rangeTo}`;
  }

  let debounceTimer = null;
  function scheduleRender() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  }

  function setRange(from, to) {
    state.rangeFrom = Math.min(from, to);
    state.rangeTo = Math.max(from, to);
    document.getElementById("fromSlider").value = state.rangeFrom;
    document.getElementById("toSlider").value = state.rangeTo;
    updateRangeLabel();
    scheduleRender();
  }

  document.getElementById("fromSlider").addEventListener("input", (e) => {
    let v = parseInt(e.target.value, 10);
    if (v > state.rangeTo) v = state.rangeTo;
    state.rangeFrom = v;
    e.target.value = v;
    updateRangeLabel();
    scheduleRender();
  });
  document.getElementById("toSlider").addEventListener("input", (e) => {
    let v = parseInt(e.target.value, 10);
    if (v < state.rangeFrom) v = state.rangeFrom;
    state.rangeTo = v;
    e.target.value = v;
    updateRangeLabel();
    scheduleRender();
  });
  document.querySelectorAll(".presets button").forEach((btn) => {
    btn.addEventListener("click", () => {
      const preset = btn.dataset.preset;
      if (preset === "all") setRange(state.yearMin, state.yearMax);
      else if (preset === "latest") setRange(state.yearMax, state.yearMax);
      else setRange(Math.max(state.yearMin, state.yearMax - parseInt(preset, 10)), state.yearMax);
    });
  });
  document.getElementById("modeToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    state.mode = btn.dataset.mode;
    document.querySelectorAll("#modeToggle button").forEach((b) => b.classList.toggle("active", b.dataset.mode === state.mode));
    render();
  });

  function init() {
    setLoading(true);
    fetchJson(`${DATA_DIR}/manifest.json`).then((manifest) => {
      state.manifest = manifest;
      const allYears = [
        ...manifest.federal.years, ...manifest.european.years,
        ...Object.values(manifest.landtag.states).flatMap((s) => s.years),
        ...Object.values(manifest.kommunal.states).flatMap((s) => s.years),
      ].map(Number);
      state.yearMin = Math.min(...allYears);
      state.yearMax = Math.max(...allYears);
      const fromSlider = document.getElementById("fromSlider");
      const toSlider = document.getElementById("toSlider");
      fromSlider.min = toSlider.min = state.yearMin;
      fromSlider.max = toSlider.max = state.yearMax;
      state.rangeFrom = state.yearMin;
      state.rangeTo = state.yearMax;
      fromSlider.value = state.rangeFrom;
      toSlider.value = state.rangeTo;
      updateRangeLabel();

      return fetchJson(`${DATA_DIR}/gemeinden.geojson`).then((muniBoundary) => {
        state.muniBoundary = muniBoundary;
        return loadAll();
      });
    }).then(() => {
      document.getElementById("noteLine").textContent =
        "Each area's number blends all 4 election types (first averaged within a type, then across types) over the window above, so one type having more elections in history doesn't dominate. A party outside an area's local top 5 counts as 0% that year/type - needed so a party that only occasionally surges isn't inflated by counting just its good years (a different tradeoff than map-election-timeseries, which leaves those points blank instead).";
      render();
    }).catch((err) => {
      document.getElementById("statusLine").textContent = `Failed to load: ${err.message}`;
    }).finally(() => setLoading(false));
  }

  init();
})();
</script>
</body>
</html>
